<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Start</title>
<style>
  :root { --bg:#fbfaf7; --ink:#1c1b19; --muted:#6b675f; --line:#dedad0; --card:#fff;
          --ok:#1f7a4d; --warn:#9a6200; --bad:#a3312b; --spine:#1d4f91; --spine-bg:#e8f0fb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161513; --ink:#ece9e2; --muted:#9d988d; --line:#34322d; --card:#1f1e1b;
            --ok:#5fc48f; --warn:#e0a94a; --bad:#ef7f77; --spine:#8fb8f2; --spine-bg:#1e2c40; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, sans-serif; }
  main { max-width:1000px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:1.5rem; margin:0 0 4px; }
  h2 { font-size:1rem; margin:0 0 10px; }
  h3 { font-size:.95rem; margin:0 0 4px; }
  p { margin:0 0 8px; }
  .sub { color:var(--muted); margin:0 0 12px; }
  .legal { color:var(--warn); border:1px solid currentColor; border-radius:8px; padding:8px 12px;
           font-size:.9rem; margin:0 0 16px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  section.queue { border-color:var(--spine); border-width:2px; }
  .badge { display:inline-block; font-size:.72rem; font-weight:600; letter-spacing:.03em; text-transform:uppercase;
           padding:2px 8px; border-radius:99px; border:1px solid currentColor; margin:0 6px 0 0; vertical-align:middle;
           white-space:nowrap; }
  .b-ok { color:var(--ok); } .b-warn { color:var(--warn); } .b-bad { color:var(--bad); }
  .b-spine { color:var(--spine); } .b-muted { color:var(--muted); }
  .note { color:var(--muted); font-size:.9rem; }
  .err { color:var(--bad); font-size:.9rem; margin-top:6px; }
  .feed { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
  button { font:inherit; cursor:pointer; }
  button.pick, button.opt { padding:6px 12px; border-radius:6px; border:1px solid var(--line);
           background:transparent; color:var(--ink); text-align:left; }
  button.pick.sel, button.opt.rec { border-color:var(--spine); background:var(--spine-bg); color:var(--spine); }
  button.opt.chosen { border-color:var(--ok); color:var(--ok); font-weight:600; background:transparent; }
  button:disabled { opacity:.6; cursor:default; }
  .pick small { display:block; color:var(--muted); font-size:.75rem; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(130px, 1fr)); gap:10px; }
  .stat { border:1px solid var(--line); border-radius:8px; padding:10px; }
  .stat b { display:block; font-size:1.4rem; font-variant-numeric:tabular-nums; }
  .stat span { color:var(--muted); font-size:.8rem; }
  .item { padding:10px 0; border-top:1px dashed var(--line); }
  .item:first-of-type { border-top:0; }
  .opts { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .cols { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:720px) { .cols { grid-template-columns:1fr; } }
  ul { margin:6px 0 0; padding-left:20px; }
  li { margin-bottom:4px; }
  a { color:var(--spine); overflow-wrap:anywhere; }
  details { border-top:1px dashed var(--line); padding:8px 0; }
  details:first-of-type { border-top:0; }
  summary { cursor:pointer; font-weight:600; }
  pre { margin:8px 0 0; padding:12px; background:var(--bg); border:1px solid var(--line); border-radius:8px;
        overflow-x:auto; font:13px/1.45 ui-monospace, Menlo, monospace; white-space:pre-wrap; overflow-wrap:anywhere; }
  textarea { width:100%; min-height:84px; padding:10px; border-radius:8px; border:1px solid var(--line);
             background:var(--bg); color:var(--ink); font:inherit; resize:vertical; }
  button.primary { padding:8px 16px; border-radius:6px; border:1px solid var(--spine);
                   background:var(--spine); color:var(--bg); font-weight:600; margin-top:8px; }
  button.steer { margin-top:12px; }
  .working { border:1px dashed var(--spine); border-radius:10px; padding:12px 16px; margin-bottom:16px; }
  .working:empty { display:none; }
  .working .job { padding:8px 0; border-top:1px dashed var(--line); }
  .working .job:first-child { border-top:0; }
  .working .job p { margin:0 0 2px; overflow-wrap:anywhere; }
  .idea { border-left:3px solid var(--line); padding-left:10px; color:var(--muted); margin-top:8px; overflow-wrap:anywhere; }
</style>
</head>
<body>
<main>
  <h1>Start</h1>
  <p class="sub">You steer, the agent does the rest. One idea in; a launch packet and a short list of decisions out.</p>
  <p class="legal">Not legal, tax or investment advice. Nothing is filed or sent.</p>
  <section id="ask">
    <h2><label for="idea">What's the idea?</label></h2>
    <textarea id="idea" maxlength="4000" placeholder="Describe the company in a sentence or two"></textarea>
    <button type="button" class="primary" id="send">Hand it to the agent</button>
    <p class="note" id="ideaMsg"></p>
  </section>
  <div class="working" id="working"></div>
  <p class="note" id="status">Loading…</p>
  <div class="feed" id="feed"></div>
  <div id="view"></div>
</main>
<script src="config.js" onerror="this.remove()"></script>
<script src="latest.js" onerror="this.remove()"></script>
<script>
(function () {
  'use strict';

  var TABLE = '/rest/v1/papers';
  var KINDS = 'startup-packet,startup-decision,startup-request,startup-error';
  var POLL_MS = 6000, STALE_MS = 15 * 60 * 1000, ERROR_WINDOW_MS = 60 * 60 * 1000;
  var state = { packets: [], decisions: {}, requests: [], errors: [], pending: {}, selected: null,
                online: false, loading: false, sig: '', timer: null };

  // ---- safe accessors: every row is untrusted -------------------------------
  function str(v) { return typeof v === 'string' ? v : (typeof v === 'number' ? String(v) : ''); }
  function list(v) { return Array.isArray(v) ? v : []; }
  function obj(v) { return v && typeof v === 'object' && !Array.isArray(v) ? v : {}; }
  function num(v) { return typeof v === 'number' && isFinite(v) ? v : 0; }
  function safeUrl(v) { var s = str(v).trim(); return /^https?:\/\//i.test(s) ? s : ''; }

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined && text !== null) node.textContent = str(text);
    return node;
  }
  function add(parent) {
    for (var i = 1; i < arguments.length; i++) if (arguments[i]) parent.appendChild(arguments[i]);
    return parent;
  }
  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }
  function badge(text, tone) { return el('span', 'badge b-' + tone, text); }
  function section(title, cls) {
    var s = el('section', cls || '');
    s.appendChild(el('h2', '', title));
    return s;
  }

  // ---- data -----------------------------------------------------------------
  function config() {
    var c = obj(window.START_CONFIG);
    var url = safeUrl(c.supabaseUrl).replace(/\/+$/, '');
    var key = str(c.anonKey);
    return url && key ? { url: url, key: key } : null;
  }
  function headers(cfg, extra) {
    var h = { apikey: cfg.key, Authorization: 'Bearer ' + cfg.key };
    for (var k in extra) h[k] = extra[k];
    return h;
  }
  function isPacketRow(row) {
    var spec = obj(obj(row).spec);
    return spec.kind === 'startup-packet' && spec.packet && typeof spec.packet === 'object';
  }
  function decisionKey(packetId, decisionId) { return str(packetId) + '::' + str(decisionId); }

  function ingest(rows) {
    var packets = [], decisions = {}, requests = [], errors = [], answered = {}, arrived = null;
    var wasPending = state.pending;
    // rows arrive newest first; the first decision seen per key is the latest
    list(rows).forEach(function (row) {
      try {
        var spec = obj(obj(row).spec);
        if (isPacketRow(row)) {
          packets.push(row);
          var answers = str(spec.request_id);
          if (answers) {
            answered[answers] = true;
            if (arrived === null && wasPending[answers]) arrived = row.id;
          }
        } else if (spec.kind === 'startup-decision') {
          var key = decisionKey(spec.packet_id, spec.decision_id);
          if (!(key in decisions) && str(spec.choice)) decisions[key] = str(spec.choice);
        } else if (spec.kind === 'startup-request' && str(obj(row).id)) {
          if (spec.action === 'new' && str(spec.idea)) requests.push(row);
          else if (spec.action === 'steer' && num(spec.packet_id)) requests.push(row);
        } else if (spec.kind === 'startup-error' && str(spec.request_id)) {
          answered[str(spec.request_id)] = true;
          errors.push(row);
        }
      } catch (e) { console.warn('skipped malformed row', e); }
    });
    var pending = {};
    requests.forEach(function (r) { if (!answered[str(r.id)]) pending[str(r.id)] = true; });
    state.packets = packets;
    state.decisions = decisions;
    state.requests = requests;
    state.errors = errors;
    state.pending = pending;
    if (arrived !== null) state.selected = arrived;  // the answer to something you asked for
    if (!packets.some(function (p) { return p.id === state.selected; })) {
      state.selected = packets.length ? packets[0].id : null;
    }
  }

  function signature(rows) {
    var top = 0;
    list(rows).forEach(function (r) { var id = num(obj(r).id); if (id > top) top = id; });
    return list(rows).length + ':' + top;
  }
  function pendingRequests() {
    return state.requests.filter(function (r) { return state.pending[str(r.id)]; });
  }
  function steerPending(packetId) {
    return pendingRequests().some(function (r) {
      var spec = obj(r.spec);
      return spec.action === 'steer' && str(spec.packet_id) === str(packetId);
    });
  }

  function setStatus(text) { document.getElementById('status').textContent = text; }

  function useOffline(reason) {
    var sig = 'offline:' + reason;
    state.online = false;
    if (state.sig === sig) { renderAsk(); return; }  // same failure as last poll: nothing new to draw
    state.sig = sig;
    var latest = window.START_LATEST;
    if (isPacketRow(latest)) {
      ingest([latest]);
      setStatus('Offline copy (' + reason + '). Ideas and decisions cannot be sent from this view.');
    } else {
      ingest([]);
      setStatus('No packets to show (' + reason + ').');
    }
    render();
  }

  function load() {
    var cfg = config();
    if (!cfg) { useOffline('no Supabase config'); return; }
    if (state.loading) return;
    state.loading = true;
    fetch(cfg.url + TABLE + '?select=*&spec->>kind=in.(' + KINDS + ')&order=created_at.desc&limit=200', { headers: headers(cfg) })
      .then(function (res) {
        if (!res.ok) throw new Error('feed returned HTTP ' + res.status);
        return res.json();
      })
      .then(function (rows) {
        state.loading = false;
        state.online = true;
        var sig = signature(rows);
        if (sig === state.sig) { renderAsk(); renderWorking(); return; }  // unchanged: keep the view as it is
        state.sig = sig;
        ingest(rows);
        if (!state.packets.length && isPacketRow(window.START_LATEST)) {
          // Nothing in the feed yet: show the saved copy, but stay connected so an idea can be sent.
          state.packets = [window.START_LATEST];
          state.selected = window.START_LATEST.id;
          setStatus('The feed has no packets yet. Showing the last saved copy.');
        } else {
          setStatus(state.packets.length
            ? state.packets.length + ' packet' + (state.packets.length === 1 ? '' : 's') + ' in the feed.'
            : 'The feed is empty. Describe an idea above to get the first packet.');
        }
        render();
      })
      .catch(function (err) {
        state.loading = false;
        console.error(err);
        useOffline('feed unreachable: ' + (err && err.message ? err.message : 'unknown error'));
      });
  }

  function startPolling() {
    if (state.timer !== null || !config()) return;  // one timer only; nothing to poll without a feed
    state.timer = setInterval(load, POLL_MS);
  }

  function postRow(body, what) {
    var cfg = config();
    if (!cfg || !state.online) return Promise.reject(new Error('Not connected to the feed, so this cannot be sent.'));
    return fetch(cfg.url + TABLE, {
      method: 'POST',
      headers: headers(cfg, { 'Content-Type': 'application/json', Prefer: 'return=representation' }),
      body: JSON.stringify(body)
    }).then(function (res) {
      if (!res.ok) throw new Error('Could not ' + what + ' (HTTP ' + res.status + ').');
      return res.json();
    });
  }

  function saveDecision(packetId, decisionId, choice) {
    return postRow({ title: 'decision', spec: { kind: 'startup-decision', packet_id: packetId, decision_id: decisionId, choice: choice } },
      'save the decision');
  }

  // A request the page just created counts as pending straight away, before the next poll sees it.
  function noteRequest(saved, fallbackSpec) {
    var row = obj(list(saved)[0]);
    if (!str(row.id)) return;
    if (!obj(row.spec).kind) row = { id: row.id, created_at: row.created_at, spec: fallbackSpec };
    if (!str(row.created_at)) row.created_at = new Date().toISOString();
    state.requests = [row].concat(state.requests);
    state.pending[str(row.id)] = true;
  }

  function sendIdea(idea) {
    var spec = { kind: 'startup-request', action: 'new', idea: idea };
    return postRow({ title: 'request', spec: spec }, 'send the idea').then(function (saved) { noteRequest(saved, spec); });
  }

  function sendSteer(packetId) {
    var spec = { kind: 'startup-request', action: 'steer', packet_id: packetId };
    return postRow({ title: 'request', spec: spec }, 'send the request').then(function (saved) { noteRequest(saved, spec); });
  }

  // ---- rendering ------------------------------------------------------------
  function elapsed(since) {
    var d = str(since) ? new Date(since) : null;
    if (!d || isNaN(d.getTime())) return { ms: 0, text: '' };
    var ms = Math.max(0, Date.now() - d.getTime()), s = Math.floor(ms / 1000);
    var text = s < 60 ? s + ' s' : Math.floor(s / 60) + ' min ' + (s % 60) + ' s';
    return { ms: ms, text: text };
  }
  function shorten(text, max) { var s = str(text); return s.length > max ? s.slice(0, max - 1) + '…' : s; }

  function renderAsk() {
    var box = document.getElementById('idea'), send = document.getElementById('send');
    var msg = document.getElementById('ideaMsg');
    var busy = send.getAttribute('data-busy') === '1';
    box.disabled = !state.online || busy;
    send.disabled = !state.online || busy;
    if (!state.online) {
      msg.className = 'note';
      msg.textContent = 'Not connected to the feed, so an idea cannot be sent from this view.';
    } else if (msg.getAttribute('data-offline') === '1' || !msg.textContent) {
      msg.className = 'note';
      msg.textContent = 'The agent researches, drafts and checks its sources on its own. You get back only the decisions.';
    }
    msg.setAttribute('data-offline', state.online ? '0' : '1');
  }

  function renderWorking() {
    var box = document.getElementById('working');
    clear(box);
    try {
      pendingRequests().slice(0, 5).forEach(function (r) {
        var spec = obj(r.spec), job = el('div', 'job'), t = elapsed(r.created_at);
        if (spec.action === 'steer') {
          add(job, el('p', '', 'Reworking packet #' + num(spec.packet_id) + ' around your decisions'));
        } else {
          add(job, el('p', '', shorten(spec.idea, 140)),
            el('p', 'note', 'The agent is researching. This usually takes 3 to 5 minutes.'));
        }
        if (t.text) add(job, el('p', 'note', 'Asked ' + t.text + ' ago.'));
        if (t.ms > STALE_MS) add(job, el('p', 'err', 'Still no answer. Check that the worker is running.'));
        box.appendChild(job);
      });
      var shown = 0;
      state.errors.forEach(function (row) {
        var spec = obj(row.spec), t = elapsed(row.created_at);
        if (shown >= 5 || t.ms > ERROR_WINDOW_MS) return;
        shown += 1;
        var asked = state.requests.filter(function (r) { return str(r.id) === str(spec.request_id); })[0];
        var about = asked ? obj(asked.spec) : {};
        var label = about.action === 'steer' ? 'Reworking packet #' + num(about.packet_id)
          : str(about.idea) ? shorten(about.idea, 140) : 'Request #' + str(spec.request_id);
        var job = el('div', 'job');
        add(job, el('p', '', label),
          el('p', 'err', 'The agent could not finish this: ' + (shorten(spec.message, 400) || 'no reason given')));
        box.appendChild(job);
      });
    } catch (e) {
      console.error('working strip failed to render', e);
      box.appendChild(el('p', 'err', 'The list of requests in progress could not be shown.'));
    }
  }

  function renderFeed() {
    var feed = document.getElementById('feed');
    clear(feed);
    state.packets.forEach(function (row) {
      var company = obj(obj(obj(row.spec).packet).company);
      var b = el('button', 'pick' + (row.id === state.selected ? ' sel' : ''));
      b.type = 'button';
      b.appendChild(document.createTextNode(str(company.name) || str(row.title) || 'Untitled'));
      if (num(obj(row.spec).revision_of)) b.appendChild(document.createTextNode(' (revised)'));
      var when = str(row.created_at);
      var d = when ? new Date(when) : null;
      if (d && !isNaN(d.getTime())) b.appendChild(el('small', '', d.toLocaleString()));
      b.addEventListener('click', function () { state.selected = row.id; render(); });
      feed.appendChild(b);
    });
  }

  function renderHeader(row, spec, packet) {
    var company = obj(packet.company);
    var s = el('section');
    var h = el('h2', '', str(company.name) || str(row.title) || 'Untitled');
    h.style.fontSize = '1.25rem';
    var worker = str(spec.worker);
    var meta = el('p');
    add(meta,
      worker === 'agent37' ? badge('Agent37 worker', 'ok')
        : worker === 'openai-direct' ? badge('OpenAI direct, no browsing', 'warn')
        : badge('worker unknown', 'muted'),
      num(obj(spec.audit).search_results) ? badge('Monid live search', 'ok') : null,
      str(company.sector) ? badge(str(company.sector), 'spine') : null,
      str(company.jurisdiction) ? badge(str(company.jurisdiction), 'muted') : null);
    add(s, h, el('p', '', company.one_liner), meta);
    var decided = obj(spec.decided), decidedKeys = Object.keys(decided);
    if (num(spec.revision_of) && decidedKeys.length) {
      add(s, el('p', 'note', 'Reworked from packet #' + num(spec.revision_of) + ' after you decided: ' +
        decidedKeys.map(function (k) { return str(k) + ' = ' + str(decided[k]); }).join('; ')));
    }
    if (str(spec.idea)) {
      add(s, el('p', 'note', 'The idea as given:'), el('p', 'idea', spec.idea));
    }
    return s;
  }

  function stat(value, label) {
    var d = el('div', 'stat');
    add(d, el('b', '', String(value)), el('span', '', label));
    return d;
  }

  function renderAudit(spec) {
    var audit = obj(spec.audit), w = obj(audit.workload), src = obj(audit.sources);
    var s = section('Self-check');
    var grid = el('div', 'stats');
    add(grid,
      stat(num(w.agent), 'tasks the agent did'),
      stat(num(w.ceo), 'tasks for you'),
      stat(num(w.professional), 'need a professional'),
      stat(num(audit.decisions), 'decisions waiting'),
      stat(num(src.verified) + ' / ' + num(src.claimed), 'sources that resolved'),
      stat(num(src.downgraded), 'downgraded to unverified'),
      num(audit.seconds) ? stat(Math.round(num(audit.seconds)) + ' s', 'agent run time, measured') : null,
      num(audit.search_results) ? stat(num(audit.search_results), 'live search results read') : null);
    add(s, grid, el('p', 'note',
      'A source keeps its "sourced" label only if its link is a web address that loads. Everything else is marked unverified.'));
    s.lastChild.style.marginTop = '10px';
    return s;
  }

  function renderDecisions(row, packet) {
    var decisions = list(packet.decisions);
    var s = section('Decisions for you (' + decisions.length + ')', 'queue');
    if (!decisions.length) { s.appendChild(el('p', 'note', 'Nothing needs your decision.')); return s; }
    decisions.forEach(function (raw) {
      var d = obj(raw);
      var item = el('div', 'item');
      var made = state.decisions[decisionKey(row.id, d.id)];
      add(item, el('h3', '', d.question), el('p', 'note', d.why));
      var opts = el('div', 'opts');
      var msg = el('p', made ? 'note' : 'err', made ? 'You chose: ' + made : '');
      list(d.options).forEach(function (rawOpt) {
        var opt = str(rawOpt);
        if (!opt) return;
        var isRec = opt === str(d.recommended);
        var b = el('button', 'opt' + (made === opt ? ' chosen' : isRec ? ' rec' : ''),
          opt + (isRec ? '  (recommended)' : ''));
        b.type = 'button';
        b.addEventListener('click', function () {
          var buttons = opts.querySelectorAll('button');
          buttons.forEach(function (x) { x.disabled = true; });
          msg.className = 'note';
          msg.textContent = 'Saving…';
          saveDecision(row.id, str(d.id), opt).then(function () {
            state.decisions[decisionKey(row.id, d.id)] = opt;
            render();
          }).catch(function (err) {
            console.error(err);
            buttons.forEach(function (x) { x.disabled = false; });
            msg.className = 'err';
            msg.textContent = err && err.message ? err.message : 'Could not save the decision.';
          });
        });
        opts.appendChild(b);
      });
      add(item, opts, msg);
      s.appendChild(item);
    });
    s.appendChild(renderSteer(row, decisions));
    return s;
  }

  function renderSteer(row, decisions) {
    var wrap = el('div', 'item');
    var decidedAny = decisions.some(function (raw) { return !!state.decisions[decisionKey(row.id, obj(raw).id)]; });
    var waiting = steerPending(row.id);
    var b = el('button', 'primary steer', 'Rework the plan around my decisions');
    var note = el('p', 'note',
      waiting ? 'The agent is reworking this plan. The new version will appear here when it is ready.'
        : !state.online ? 'Not connected to the feed, so this cannot be sent.'
        : decidedAny ? 'The agent will rebuild the roadmap, checklist and drafts around what you chose.'
        : 'Answer at least one decision first.');
    b.type = 'button';
    b.disabled = !decidedAny || waiting || !state.online;
    b.addEventListener('click', function () {
      b.disabled = true;
      note.className = 'note';
      note.textContent = 'Sending…';
      sendSteer(row.id).then(function () { render(); }).catch(function (err) {
        console.error(err);
        b.disabled = false;
        note.className = 'err';
        note.textContent = err && err.message ? err.message : 'Could not send the request.';
      });
    });
    add(wrap, b, note);
    return wrap;
  }

  var OWNER = { agent: ['agent', 'ok'], ceo: ['you', 'spine'], professional: ['professional', 'warn'] };
  var STATUS = { drafted: 'drafted', needs_decision: 'needs your decision', needs_professional: 'needs a professional' };

  function renderStages(packet) {
    var s = section('Roadmap');
    var stages = list(packet.stages);
    if (!stages.length) s.appendChild(el('p', 'note', 'No stages.'));
    stages.forEach(function (raw, i) {
      var st = obj(raw);
      var item = el('div', 'item');
      add(item, el('h3', '', (i + 1) + '. ' + str(st.name)), el('p', '', st.goal),
        el('p', 'note', 'Done when: ' + str(st.exit_criteria)));
      var ul = el('ul');
      list(st.tasks).forEach(function (rawTask) {
        var t = obj(rawTask);
        var owner = OWNER[str(t.owner)] || [str(t.owner) || 'unassigned', 'muted'];
        var li = el('li');
        add(li, badge(owner[0], owner[1]), document.createTextNode(str(t.title) + ' '),
          el('span', 'note', STATUS[str(t.status)] || str(t.status)));
        ul.appendChild(li);
      });
      item.appendChild(ul);
      s.appendChild(item);
    });
    return s;
  }

  function sourceLine(item) {
    var p = el('p', 'note');
    var url = safeUrl(item.source_url);
    if (str(item.confidence) === 'sourced' && url) {
      var a = el('a', '', url);
      a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer';
      add(p, badge('sourced', 'ok'), a);
    } else {
      add(p, badge('unverified', 'warn'), document.createTextNode('Check this before relying on it.'));
    }
    return p;
  }

  function renderCompliance(packet) {
    var s = section('Legal and compliance checklist');
    var items = list(packet.compliance);
    if (!items.length) s.appendChild(el('p', 'note', 'No items.'));
    items.forEach(function (raw) {
      var c = obj(raw), item = el('div', 'item');
      add(item, el('h3', '', c.item), el('p', '', c.why), el('p', 'note', 'When: ' + str(c.when)), sourceLine(c));
      s.appendChild(item);
    });
    return s;
  }

  function renderFunding(packet) {
    var s = section('Funding targets');
    var items = list(packet.funding);
    if (!items.length) s.appendChild(el('p', 'note', 'No targets.'));
    items.forEach(function (raw) {
      var f = obj(raw), item = el('div', 'item');
      var h = el('h3', '', f.name);
      if (str(f.type)) { h.appendChild(document.createTextNode(' ')); h.appendChild(badge(str(f.type), 'muted')); }
      add(item, h, el('p', '', f.why_fit), sourceLine(f));
      s.appendChild(item);
    });
    return s;
  }

  function renderHires(packet) {
    var s = section('First hires');
    var items = list(packet.hires);
    if (!items.length) s.appendChild(el('p', 'note', 'No hires listed.'));
    items.forEach(function (raw) {
      var h = obj(raw), item = el('div', 'item');
      var head = el('h3', '', h.role);
      if (str(h.stage)) { head.appendChild(document.createTextNode(' ')); head.appendChild(badge(str(h.stage), 'muted')); }
      add(item, head, el('p', '', h.why));
      s.appendChild(item);
    });
    return s;
  }

  function renderDrafts(packet) {
    var s = section('Drafts the agent wrote');
    var items = list(packet.drafts);
    if (!items.length) s.appendChild(el('p', 'note', 'No drafts.'));
    items.forEach(function (raw) {
      var d = obj(raw), det = el('details');
      var sum = el('summary', '', str(d.title) || 'Untitled draft');
      if (str(d.kind)) { sum.appendChild(document.createTextNode(' ')); sum.appendChild(badge(str(d.kind), 'muted')); }
      add(det, sum, el('pre', '', d.body));
      s.appendChild(det);
    });
    return s;
  }

  function renderLimits(packet) {
    var s = section('Limits');
    var ul = el('ul');
    list(packet.limits).forEach(function (l) { if (str(l)) ul.appendChild(el('li', '', l)); });
    ul.appendChild(el('li', '', 'Not legal, tax or investment advice. Nothing is filed or sent.'));
    s.appendChild(ul);
    return s;
  }

  function openDrafts(view) {
    var open = {};
    view.querySelectorAll('details').forEach(function (d, i) { if (d.open) open[i] = true; });
    return open;
  }

  function render() {
    renderAsk();
    renderWorking();
    renderFeed();
    var view = document.getElementById('view');
    var keepOpen = view.getAttribute('data-packet') === str(state.selected) ? openDrafts(view) : {};
    view.setAttribute('data-packet', str(state.selected));
    clear(view);
    var row = state.packets.filter(function (p) { return p.id === state.selected; })[0];
    if (!row) return;
    var spec = obj(row.spec), packet = obj(spec.packet);
    var parts = [
      function () { return renderHeader(row, spec, packet); },
      function () { return renderDecisions(row, packet); },
      function () { return renderAudit(spec); },
      function () { return renderStages(packet); },
      function () {
        var cols = el('div', 'cols');
        add(cols, renderCompliance(packet), renderFunding(packet));
        return cols;
      },
      function () { return renderHires(packet); },
      function () { return renderDrafts(packet); },
      function () { return renderLimits(packet); }
    ];
    parts.forEach(function (build) {
      try { view.appendChild(build()); }
      catch (e) {
        console.error('section failed to render', e);
        view.appendChild(el('p', 'err', 'One section of this packet is malformed and was skipped.'));
      }
    });
    view.querySelectorAll('details').forEach(function (d, i) { if (keepOpen[i]) d.open = true; });
  }

  function wireAsk() {
    var box = document.getElementById('idea'), send = document.getElementById('send');
    var msg = document.getElementById('ideaMsg');
    send.addEventListener('click', function () {
      var idea = box.value.trim();
      if (!idea) {
        msg.className = 'err';
        msg.textContent = 'Write the idea first.';
        box.focus();
        return;
      }
      send.setAttribute('data-busy', '1');
      msg.className = 'note';
      msg.textContent = 'Sending…';
      renderAsk();
      sendIdea(idea).then(function () {
        send.setAttribute('data-busy', '0');
        box.value = '';
        msg.className = 'note';
        msg.textContent = 'Sent. The agent has it; the packet will open here when it is ready.';
        renderAsk();
        renderWorking();
      }).catch(function (err) {
        console.error(err);
        send.setAttribute('data-busy', '0');
        renderAsk();
        msg.className = 'err';
        msg.textContent = err && err.message ? err.message : 'Could not send the idea.';
      });
    });
  }

  wireAsk();
  load();
  startPolling();
})();
</script>
</body>
</html>
